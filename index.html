<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b35">
<title>Money Tracker Ultimate</title>
<style>
:root{--bg:#f3f6fc;--panel:#fff;--ink:#17233d;--muted:#71809a;--line:#e7ecf4;--nav:#101b35;--blue:#315efb;--cyan:#13b8a6;--red:#e34d65;--amber:#ed9b25;--shadow:0 12px 35px #1d31500d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--nav);color:#fff;padding:24px 15px;position:fixed;inset:0 auto 0 0;z-index:5;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 28px;font-weight:800;font-size:16px}.brandmark{width:37px;height:37px;border-radius:12px;background:linear-gradient(135deg,#5d7cff,#13b8a6);display:grid;place-items:center;font-weight:900}.navlabel{color:#7785a4;font-size:10px;font-weight:800;letter-spacing:1.4px;padding:12px 12px 8px}.nav button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 13px;margin:3px 0;background:transparent;color:#aab6ce;border-radius:10px;text-align:left;transition:.2s}.nav button:hover,.nav button.active{background:#243456;color:#fff}.nav button.active{box-shadow:inset 3px 0 #54d5c2}.nav .ico{width:19px;text-align:center}.sidefoot{margin-top:auto;padding:15px 10px;color:#8391ad;font-size:11px;border-top:1px solid #293653}.main{margin-left:248px;width:calc(100% - 248px);padding:28px 34px 50px;max-width:1700px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:15px}.eyebrow{color:var(--muted);font-size:12px}.top h1{font-size:25px;margin:2px 0;font-weight:800;letter-spacing:-.7px}.topright{display:flex;gap:10px;align-items:center}.pill{background:#e9efff;color:#315efb;padding:7px 11px;border-radius:30px;font-size:11px;font-weight:800}.btn{padding:10px 15px;border-radius:10px;background:var(--blue);color:white;font-weight:700;box-shadow:0 5px 14px #315efb2b}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.secondary{background:#edf1f8;color:#43516a;box-shadow:none}.btn.danger{background:#fff0f2;color:#cf3d56;box-shadow:none}.btn.small{padding:6px 9px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow);min-width:0}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:85px;height:85px;border-radius:50%;background:var(--tint);right:-25px;top:-30px}.statlabel{font-size:12px;color:var(--muted);font-weight:600}.statvalue{font-size:23px;font-weight:850;margin:9px 0 3px;letter-spacing:-.6px}.statnote{font-size:11px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px;gap:12px}.sectionhead h2{font-size:16px;margin:0;font-weight:800}.muted{color:var(--muted)}.twocol{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:570px}th{text-align:left;color:#8490a5;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #eff2f7;font-size:12px}tr:last-child td{border-bottom:0}.amount{font-weight:800;white-space:nowrap}.positive{color:#0b9a7b}.negative{color:#df5267}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;background:#eff3f9;color:#64728a;font-size:10px;font-weight:750}.tag.good{background:#e6f8f2;color:#0b9877}.tag.warn{background:#fff4df;color:#b97912}.tag.bad{background:#ffedf0;color:#cf4058}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}.field label{font-size:11px;font-weight:750;color:#5c6980}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #dfe5ef;border-radius:9px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#6684ff;box-shadow:0 0 0 3px #315efb17}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.wide{grid-column:1/-1}.paneltitle{font-size:14px;font-weight:800;margin:0 0 15px}.empty{text-align:center;padding:30px;color:#8793a8;font-size:12px}.barrow{display:grid;grid-template-columns:100px 1fr 90px;gap:10px;align-items:center;margin:13px 0;font-size:11px}.bar{height:8px;background:#edf1f7;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#315efb,#19bca9)}.progress{height:8px;background:#edf1f7;border-radius:20px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#315efb,#17b99f)}.notice{padding:12px 14px;border-radius:10px;background:#fff6e6;color:#95600e;font-size:12px;margin:10px 0}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#14213d;color:white;padding:13px 17px;border-radius:11px;box-shadow:0 10px 30px #0002;z-index:30;animation:up .25s ease;max-width:90vw}.toast.error{background:#bd344c}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.loading{opacity:.55;pointer-events:none}.mobilebar{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap}.right{text-align:right}.filter{max-width:180px}.reporthead{display:none}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:23px}.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}}
@media(max-width:700px){.sidebar{width:100%;height:65px;inset:auto 0 0;padding:5px 8px;display:block}.brand,.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:3px}.nav button{min-width:58px;width:auto;flex-direction:column;justify-content:center;gap:1px;padding:6px 8px;margin:0;font-size:9px}.nav .ico{font-size:17px}.main{margin:0;width:100%;padding:18px 13px 90px}.top{align-items:flex-start;margin-bottom:18px}.top h1{font-size:21px}.topright{gap:5px}.topright .pill{display:none}.grid{gap:9px}.card{padding:14px;border-radius:12px}.statvalue{font-size:18px}.twocol{grid-template-columns:1fr}.sectionhead{margin-top:20px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar>*{flex:1}.filter{max-width:none}.btn{padding:9px 11px}.barrow{grid-template-columns:75px 1fr 75px}.mobilebar{display:block}}
@media print{body{background:#fff}.sidebar,.topright,.toolbar,.actions,.btn{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none;break-inside:avoid}.reporthead{display:block}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">M</div><div>Money Tracker<small style="display:block;color:#8291ae;font-size:10px;font-weight:500">ULTIMATE V7.2</small></div></div>
 <div class="navlabel">WORKSPACE</div>
 <nav class="nav" id="nav">
 <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
 <button data-page="transactions"><span class="ico">⇄</span>Transaksi</button>
 <button data-page="accounts"><span class="ico">▣</span>Rekening</button>
 <button data-page="categories"><span class="ico">◈</span>Kategori</button>
 <button data-page="budgets"><span class="ico">▤</span>Anggaran</button>
 <button data-page="goals"><span class="ico">◎</span>Tabungan</button>
 <button data-page="debts"><span class="ico">↘</span>Utang</button>
 <button data-page="receivables"><span class="ico">↗</span>Piutang</button>
 <button data-page="bills"><span class="ico">▧</span>Tagihan</button>
 <button data-page="allocations"><span class="ico">◫</span>Dana Alokasi</button>
 <button data-page="insights"><span class="ico">⌁</span>Analisis</button>
 <button data-page="settings"><span class="ico">⚙</span>Pengaturan</button>
 </nav>
 <div class="sidefoot">PRIVATE FINANCE WORKSPACE<br>Data tersimpan di Google Sheets</div>
</aside>
<main class="main">
 <header class="top"><div><div class="eyebrow">PERSONAL FINANCE / <span id="crumb">OVERVIEW</span></div><h1 id="pageTitle">Ringkasan Keuangan</h1></div><div class="topright"><span class="pill" id="connection">Menghubungkan...</span><button class="btn" onclick="quickAdd()">＋ Catat</button></div></header>
 <div id="view"><div class="card empty">Memuat data keuangan...</div></div>
</main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbxsouVbcJ3B0rDl1Hv8livCUU6EoQmOBKjqbeA2tScQwF6XqdOcsjJGd7E0eiTE8cWL/exec";
const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const idr=n=>"Rp"+Math.round(Number(n)||0).toLocaleString("id-ID"), today=()=>{let d=new Date(),z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)}, monthNow=()=>today().slice(0,7);
let state={page:"dashboard",dashboard:null,accounts:[],categories:[],transactions:[],budgets:[],goals:[],debts:[],receivables:[],bills:[],allocations:[],notifications:[],insights:null,forecast:null,settings:{}};
function toast(msg,error=false){let t=$("#toast");t.textContent=msg;t.className="toast"+(error?" error":"");clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.add("hidden"),3500)}
function api(action,data={}){return new Promise((resolve,reject)=>{const cb="mtcb_"+Date.now()+"_"+Math.random().toString(36).slice(2);let done=false;const script=document.createElement("script");const cleanup=()=>{delete window[cb];script.remove();clearTimeout(timer)};const timer=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error("Koneksi API timeout. Periksa deployment Apps Script."))}},18000);window[cb]=res=>{if(done)return;done=true;cleanup();if(!res||!res.ok)reject(new Error(res?.error||"API gagal"));else resolve(res.data)};script.onerror=()=>{if(!done){done=true;cleanup();reject(new Error("Tidak dapat mengakses Apps Script. Periksa URL dan deployment."))}};script.src=API_URL+"?action="+encodeURIComponent(action)+"&data="+encodeURIComponent(JSON.stringify(data))+"&callback="+cb;document.head.appendChild(script)})}
async function loadAll(){try{let [dash,accounts,categories,tx,budgets,goals,debts,receivables,bills,allocations,notifications,insights,forecast,settings]=await Promise.all(["dashboard","accounts","categories","transactions","budgets","goals","debts","receivables","bills","allocations","notifications","insights","forecast","settings"].map((a,i)=>api(a,i===3?{from:"2000-01-01"}:{})));Object.assign(state,{dashboard:dash,accounts,categories,transactions:tx,budgets,goals,debts,receivables,bills,allocations,notifications,insights,forecast,settings});$("#connection").textContent="● Terhubung";$("#connection").style.color="#078d72";render()}catch(e){$("#connection").textContent="● Offline";$("#connection").style.color="#d34c62";$("#view").innerHTML=`<div class="card"><h3>Gagal memuat data</h3><p class="muted">${esc(e.message)}</p><button class="btn" onclick="loadAll()">Coba lagi</button><div class="notice">Pastikan deployment Apps Script aktif sebagai Web App dan aksesnya sesuai akun pemilik data.</div></div>`}}
function moneyStat(label,value,note,color){return `<div class="card stat" style="--tint:${color}18"><div class="statlabel">${label}</div><div class="statvalue">${idr(value)}</div><div class="statnote">${note||""}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`}
function setPage(p){state.page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));const names={dashboard:"Ringkasan Keuangan",transactions:"Riwayat Transaksi",accounts:"Rekening & Saldo",categories:"Kategori Transaksi",budgets:"Anggaran Bulanan",goals:"Target Tabungan",debts:"Manajemen Utang",receivables:"Manajemen Piutang",bills:"Tagihan Rutin",allocations:"Dana Alokasi",insights:"Analisis Keuangan",settings:"Pengaturan"};$("#pageTitle").textContent=names[p];$("#crumb").textContent=p.toUpperCase();render()}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)setPage(b.dataset.page)});
function render(){let p=state.page,fn={dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,categories:renderCategories,budgets:renderBudgets,goals:renderGoals,debts:renderDebts,receivables:renderReceivables,bills:renderBills,allocations:renderAllocations,insights:renderInsights,settings:renderSettings}[p];if(fn)$("#view").innerHTML=fn()}
function renderDashboard(){let d=state.dashboard||{},safe=d.safeToSpend||{},s=d.insights||{};let recent=(d.recentTransactions||[]).map(t=>txRow(t)).join("");let cats=d.categories||[];return `<div class="reporthead"><h1>Laporan Money Tracker</h1><p>Dicetak ${today()}</p></div><div class="grid">${moneyStat("Total Saldo",d.totalBalance,"Seluruh rekening aktif","#315efb")}${moneyStat("Pemasukan Bulan Ini",d.income,"Bulan berjalan","#10b981")}${moneyStat("Pengeluaran Bulan Ini",d.expense,"Bulan berjalan","#e34d65")}${moneyStat("Safe to Spend",safe.safeToSpend,"Dana bebas setelah alokasi & kewajiban","#ed9b25")}</div><div class="sectionhead"><h2>Kontrol keuangan</h2><span class="tag good">${esc(d.month||monthNow())}</span></div><div class="twocol"><div class="card"><h3 class="paneltitle">Arus kas bulan ini</h3><div style="display:flex;justify-content:space-between;margin:14px 0"><span class="muted">Pemasukan</span><b class="positive">${idr(d.income)}</b></div><div class="progress"><i style="width:${Math.min(100,d.income?d.income/(d.income+d.expense)*100:0)}%"></i></div><div style="display:flex;justify-content:space-between;margin:14px 0"><span class="muted">Pengeluaran</span><b class="negative">${idr(d.expense)}</b></div><div class="progress"><i style="width:${Math.min(100,d.expense?d.expense/(d.income+d.expense)*100:0)}%;background:linear-gradient(90deg,#e34d65,#f49a70)"></i></div><div class="sectionhead"><span class="muted">Arus kas bersih</span><b class="${d.netCashflow>=0?"positive":"negative"}">${idr(d.netCashflow)}</b></div></div><div class="card"><h3 class="paneltitle">Dana yang harus disisihkan</h3>${[["Dana dialokasikan",safe.allocated],["Tagihan belum dibayar",safe.bills],["Minimum pembayaran utang",safe.debtMinimum]].map(x=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)"><span class="muted">${x[0]}</span><b>${idr(x[1])}</b></div>`).join("")}<div class="notice">Safe to Spend adalah estimasi dana bebas berdasarkan saldo, alokasi, tagihan jatuh tempo, dan minimum utang.</div></div></div><div class="sectionhead"><h2>Pengeluaran per kategori</h2><button class="btn secondary small" onclick="setPage('budgets')">Atur anggaran</button></div><div class="card">${cats.length?cats.slice(0,6).map(c=>`<div class="barrow"><span>${esc(c.name)}</span><div class="bar"><i style="width:${Math.min(100,c.spent/Math.max(...cats.map(x=>x.spent),1)*100)}%"></i></div><b class="right">${idr(c.spent)}</b></div>`).join(""):'<div class="empty">Belum ada pengeluaran bulan ini.</div>'}</div><div class="sectionhead"><h2>Transaksi terbaru</h2><button class="btn secondary small" onclick="setPage('transactions')">Lihat semua</button></div><div class="card">${table(["Tanggal","Deskripsi","Jenis","Nominal"],recent)}</div>`}
function txRow(t){let typ=t.type==="income"?"Pemasukan":t.type==="expense"?"Pengeluaran":t.type==="transfer"?"Transfer":t.type==="receivable_out"?"Piutang keluar":t.type;return `<tr><td>${esc(t.date)}</td><td>${esc(t.description||"-")}</td><td><span class="tag">${esc(typ)}</span></td><td class="amount ${t.type==="income"?"positive":t.type==="expense"||t.type==="receivable_out"?"negative":""}">${t.type==="income"?"+":"−"}${idr(t.amount)}</td></tr>`}
function accountOptions(){return state.accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${idr(a.balance)}</option>`).join("")}
function categoryOptions(type){return state.categories.filter(c=>!type||c.type===type).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}
function renderTransactions(){let rows=state.transactions.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description||"-")}</td><td>${esc(state.accounts.find(a=>a.id===t.accountId)?.name||"-")}</td><td><span class="tag">${esc(t.type)}</span></td><td class="amount">${idr(t.amount)}</td><td>${t.type==="transfer"?`<button class="btn danger small" onclick="removeTransfer('${esc(t.transferId)}')">Hapus</button>`:t.type==="receivable_out"?'<span class="muted">Terkait piutang</span>':`<button class="btn danger small" onclick="removeTx('${esc(t.id)}')">Hapus</button>`}</td></tr>`).join("");return `<div class="card"><div class="toolbar"><input class="filter" type="date" id="from"><input class="filter" type="date" id="to"><select class="filter" id="txType"><option value="all">Semua jenis</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option><option value="transfer">Transfer</option></select><button class="btn secondary" onclick="filterTx()">Terapkan</button><button class="btn secondary" onclick="print()">Cetak / PDF</button><button class="btn" onclick="openForm('transaction')">＋ Transaksi</button><button class="btn secondary" onclick="openForm('transfer')">⇄ Transfer</button></div>${table(["Tanggal","Keterangan","Rekening","Jenis","Nominal","Aksi"],rows)}</div>`}
function renderAccounts(){let rows=state.accounts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.type)}</td><td class="amount">${idr(a.balance)}</td><td><span class="tag good">Aktif</span></td><td><button class="btn danger small" onclick="archive('${esc(a.id)}')">Arsipkan</button></td></tr>`).join("");return `<div class="sectionhead"><h2>Daftar rekening</h2><button class="btn" onclick="openForm('account')">＋ Tambah rekening</button></div><div class="card">${table(["Nama rekening","Tipe","Saldo saat ini","Status","Aksi"],rows)}</div>`}
function renderCategories(){let rows=state.categories.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="tag">${c.type==="income"?"Pemasukan":"Pengeluaran"}</span></td><td><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${esc(c.color)}"></i> ${esc(c.color)}</td><td><div class="actions"><button class="btn secondary small" onclick="editCategory('${esc(c.id)}')">Edit</button><button class="btn danger small" onclick="delCategory('${esc(c.id)}')">Hapus</button></div></td></tr>`).join("");return `<div class="sectionhead"><h2>Kategori aktif</h2><button class="btn" onclick="openForm('category')">＋ Tambah kategori</button></div><div class="card">${table(["Nama kategori","Tipe","Warna","Aksi"],rows)}</div>`}
function renderBudgets(){let rows=state.budgets.map(b=>{let c=state.categories.find(x=>x.id===b.categoryId)||{};let pct=b.limit?b.spent/b.limit*100:0;return `<tr><td>${esc(c.name||"Kategori")}</td><td>${b.month}/${b.year}</td><td>${idr(b.limit)}</td><td>${idr(b.spent)}</td><td><span class="tag ${pct>=100?"bad":pct>=80?"warn":"good"}">${pct.toFixed(0)}%</span></td></tr>`}).join("");return `<div class="sectionhead"><h2>Anggaran kategori</h2><button class="btn" onclick="openForm('budget')">＋ Atur anggaran</button></div><div class="card">${table(["Kategori","Periode","Batas","Terpakai","Status"],rows)}</div>`}
function renderGoals(){let rows=state.goals.map(g=>{let pct=Math.min(100,g.target?g.saved/g.target*100:0);return `<tr><td><b>${esc(g.name)}</b></td><td>${idr(g.saved)} / ${idr(g.target)}<div class="progress"><i style="width:${pct}%"></i></div></td><td>${esc(g.deadline||"-")}</td><td><button class="btn small" onclick="contribute('${esc(g.id)}')">＋ Menabung</button></td></tr>`}).join("");return `<div class="sectionhead"><h2>Target keuangan</h2><button class="btn" onclick="openForm('goal')">＋ Target baru</button></div><div class="card">${table(["Target","Progress","Deadline","Aksi"],rows)}</div>`}
function renderDebts(){let rows=state.debts.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${idr(d.principal)}</td><td class="amount">${idr(d.remaining)}</td><td>${esc(d.dueDate||"-")}</td><td><span class="tag ${d.active?"warn":"good"}">${d.active?"Berjalan":"Lunas"}</span></td><td>${d.active?`<button class="btn small" onclick="payDebt('${esc(d.id)}')">Bayar</button>`:"-"}</td></tr>`).join("");return `<div class="sectionhead"><h2>Utang yang harus dibayar</h2><button class="btn" onclick="openForm('debt')">＋ Catat utang</button></div><div class="card">${table(["Nama utang","Pokok","Sisa","Jatuh tempo","Status","Aksi"],rows)}</div>`}
function renderReceivables(){let rows=state.receivables.map(r=>`<tr><td><b>${esc(r.person)}</b><small style="display:block;color:#8994a8">${esc(r.description||"")}</small></td><td>${idr(r.principal)}</td><td class="amount">${idr(r.remaining)}</td><td>${esc(r.dueDate||"-")}</td><td><span class="tag ${r.status==="paid"?"good":"warn"}">${r.status==="paid"?"Lunas":"Belum lunas"}</span></td><td>${r.status==="open"?`<button class="btn small" onclick="payReceivable('${esc(r.id)}')">Terima</button>`:"-"}</td></tr>`).join("");return `<div class="sectionhead"><h2>Uang yang dipinjam orang lain</h2><button class="btn" onclick="openForm('receivable')">＋ Catat piutang</button></div><div class="card">${table(["Peminjam","Nominal awal","Sisa piutang","Jatuh tempo","Status","Aksi"],rows)}</div>`}
function renderBills(){let rows=state.bills.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${idr(b.amount)}</td><td>${esc(b.dueDate)}</td><td>${esc(b.repeat)}</td><td><span class="tag ${b.paid?"good":"warn"}">${b.paid?"Dibayar":"Belum dibayar"}</span></td><td>${!b.paid?`<button class="btn small" onclick="payBill('${esc(b.id)}')">Bayar</button>`:"-"}</td></tr>`).join("");return `<div class="sectionhead"><h2>Daftar tagihan</h2><button class="btn" onclick="openForm('bill')">＋ Tambah tagihan</button></div><div class="card">${table(["Tagihan","Nominal","Jatuh tempo","Pengulangan","Status","Aksi"],rows)}</div>`}
function renderAllocations(){let rows=state.allocations.map(a=>`<tr><td>${esc(a.name)}</td><td>${idr(a.amount)}</td><td>${a.month}/${a.year}</td><td><span class="tag">${esc(a.type)}</span></td></tr>`).join("");return `<div class="sectionhead"><h2>Dana yang disisihkan</h2><button class="btn" onclick="openForm('allocation')">＋ Alokasikan dana</button></div><div class="card">${table(["Nama alokasi","Nominal","Periode","Tipe"],rows)}</div>`}
function renderInsights(){let i=state.insights||{},f=state.forecast||{};let items=(i.items||[]).map(x=>`<div class="notice">${esc(x.title)} — ${esc(x.message)}</div>`).join("");return `<div class="grid">${moneyStat("Pemasukan bulan ini",i.income,"Berdasarkan transaksi","#10b981")}${moneyStat("Pengeluaran bulan ini",i.expense,"Berdasarkan transaksi","#e34d65")}${moneyStat("Arus kas bersih",i.netCashflow,"Pemasukan dikurangi pengeluaran", "#315efb")}${moneyStat("Rata-rata pengeluaran harian",f.averageDailyExpense,"Berdasarkan 30 hari terakhir","#ed9b25")}</div><div class="sectionhead"><h2>Rekomendasi disiplin keuangan</h2></div><div class="card">${items||'<div class="empty">Belum ada peringatan. Terus jaga arus kas.</div>'}</div><div class="sectionhead"><h2>Proyeksi saldo</h2></div><div class="grid">${moneyStat("Estimasi 7 hari",f.estimated7Days,"Jika pola belanja berlanjut","#315efb")}${moneyStat("Estimasi 30 hari",f.estimated30Days,"Jika pola belanja berlanjut","#13b8a6")}</div><p class="muted">Tingkat keyakinan proyeksi: ${esc(f.confidence||"-")}. Proyeksi ini estimasi algoritmik, bukan jaminan saldo masa depan.</p>`}
function renderSettings(){return `<div class="card"><h3 class="paneltitle">Preferensi sistem</h3><div class="formgrid"><div class="field"><label>Ambang pengeluaran besar (Rp)</label><input id="threshold" type="number" min="1" value="${esc(state.settings.largeExpenseThreshold||500000)}"></div><div class="field"><label>Peringatan anggaran (%)</label><input id="warning" type="number" min="1" max="100" value="${esc(state.settings.warningThreshold||80)}"></div><div class="field"><label>Mode disiplin</label><select id="discipline"><option value="strict">Strict</option><option value="standard">Standard</option></select></div></div><button class="btn" onclick="saveSettings()">Simpan pengaturan</button><button class="btn secondary" onclick="reconcile()">Periksa konsistensi saldo</button><button class="btn secondary" onclick="print()">Cetak laporan / Simpan PDF</button><div id="reconcileResult"></div></div><div class="notice">Data transaksi dan saldo tersimpan di Google Sheets. Jangan membagikan URL deployment atau akses spreadsheet kepada orang lain.</div>`}
function field(label,name,type="text",required=true,extra=""){return `<div class="field"><label>${label}${required?" *":""}</label><input name="${name}" type="${type}" ${required?"required":""} ${extra}></div>`}
function selectField(label,name,options,required=true){return `<div class="field"><label>${label}${required?" *":""}</label><select name="${name}" ${required?"required":""}>${options}</select></div>`}
function openForm(kind,extra={}){let title="",body="",action="",data={...extra};const acc=accountOptions(),catExp=categoryOptions("expense"),catAll=categoryOptions();switch(kind){
case"transaction":title="Catat transaksi";action="createTransaction";body=selectField("Jenis transaksi","type",'<option value="expense">Pengeluaran</option><option value="income">Pemasukan</option>')+field("Nominal (Rp)","amount","number",true,'min="1"')+selectField("Rekening","accountId",acc)+selectField("Kategori","categoryId",'<option value="">Tanpa kategori</option>'+catExp,false)+field("Tanggal","date","date",true,`value="${today()}"`)+field("Keterangan","description","text",false);break;
case"transfer":title="Transfer antar rekening";action="createTransfer";body=selectField("Dari rekening","fromAccountId",acc)+selectField("Ke rekening","toAccountId",acc)+field("Nominal (Rp)","amount","number",true,'min="1"')+field("Tanggal","date","date",true,`value="${today()}"`);break;
case"account":title="Tambah rekening";action="createAccount";body=field("Nama rekening","name")+selectField("Jenis rekening","type",'<option value="cash">Tunai</option><option value="bank">Bank</option><option value="ewallet">E-Wallet</option><option value="investment">Investasi</option><option value="other">Lainnya</option>')+field("Saldo awal (Rp)","initialBalance","number",false,'min="0" value="0"');break;
case"category":title="Tambah kategori";action="createCategory";body=field("Nama kategori","name")+selectField("Jenis","type",'<option value="expense">Pengeluaran</option><option value="income">Pemasukan</option>')+field("Warna","color","color",false,'value="#315efb"');break;
case"budget":title="Atur anggaran";action="setBudget";body=selectField("Kategori pengeluaran","categoryId",catExp)+field("Batas anggaran (Rp)","limit","number",true,'min="1"')+field("Periode bulan","month","month",true,`value="${monthNow()}"`);break;
case"goal":title="Buat target tabungan";action="createGoal";body=field("Nama target","name")+field("Target (Rp)","target","number",true,'min="1"')+field("Tenggat","deadline","date",false);break;
case"debt":title="Catat utang";action="createDebt";body=field("Nama utang / kreditur","name")+field("Pokok utang (Rp)","principal","number",true,'min="1"')+field("Bunga (opsional %)","interestRate","number",false,'min="0"')+field("Minimum pembayaran (Rp)","minimumPayment","number",false,'min="0"')+field("Jatuh tempo","dueDate","date",false);break;
case"receivable":title="Catat piutang";action="createReceivable";body=field("Nama peminjam","person")+field("Nominal (Rp)","principal","number",true,'min="1"')+selectField("Rekening sumber dana","accountId",acc)+field("Jatuh tempo","dueDate","date",false)+field("Keterangan","description","text",false);break;
case"bill":title="Tambah tagihan";action="createBill";body=field("Nama tagihan","name")+field("Nominal (Rp)","amount","number",true,'min="1"')+field("Jatuh tempo","dueDate","date")+selectField("Rekening pembayaran (opsional)","accountId",'<option value="">Pilih saat membayar</option>'+acc,false)+selectField("Kategori","categoryId",catExp,false)+selectField("Pengulangan","repeat",'<option value="none">Tidak berulang</option><option value="monthly">Bulanan</option>');break;
case"allocation":title="Sisihkan dana";action="createAllocation";body=field("Nama alokasi","name")+field("Nominal (Rp)","amount","number",true,'min="1"')+selectField("Tipe","type",'<option value="reserved">Dana cadangan</option><option value="savings">Tabungan</option><option value="other">Lainnya</option>')+field("Periode","month","month",true,`value="${monthNow()}"`);break;
}
if(!action)return;let modal=document.createElement("div");modal.id="modal";modal.style="position:fixed;inset:0;background:#0b173b88;z-index:20;display:grid;place-items:center;padding:15px";modal.innerHTML=`<div class="card" style="width:min(540px,100%);max-height:90vh;overflow:auto"><div class="sectionhead" style="margin:0 0 15px"><h2>${title}</h2><button class="btn secondary small" type="button" onclick="closeForm()">✕</button></div><form id="entryForm"><div class="formgrid">${body}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button type="button" class="btn secondary" onclick="closeForm()">Batal</button><button class="btn" type="submit">Simpan</button></div></form></div>`;document.body.appendChild(modal);modal.addEventListener("click",e=>{if(e.target===modal)closeForm()});if(kind==="transaction"){const typeSelect=$("#entryForm").elements.type,catSelect=$("#entryForm").elements.categoryId;typeSelect.addEventListener("change",()=>{catSelect.innerHTML='<option value="">Tanpa kategori</option>'+categoryOptions(typeSelect.value)})}$("#entryForm").addEventListener("submit",async e=>{e.preventDefault();let fd=new FormData(e.target);let payload=Object.fromEntries(fd.entries());Object.keys(payload).forEach(k=>{if(payload[k]==="")delete payload[k]});if(kind==="transaction"&&payload.type==="expense"){let sel=e.target.elements.categoryId;let opts=state.categories.filter(c=>c.type==="expense");if(sel){sel.innerHTML=categoryOptions(payload.type)}}if(kind==="budget"||kind==="allocation"){let p=String(payload.month).split("-");payload.month=payload.month; }try{await api(action,payload);closeForm();toast("Data berhasil disimpan");await loadAll()}catch(err){toast(err.message,true)}})}
function closeForm(){$("#modal")?.remove()}
function quickAdd(){if(!state.accounts.length){toast("Tambahkan rekening terlebih dahulu.",true);setPage("accounts");return}openForm("transaction")}
async function filterTx(){try{state.transactions=await api("transactions",{from:$("#from").value,to:$("#to").value,type:$("#txType").value});render()}catch(e){toast(e.message,true)}}
async function removeTx(id){if(!confirm("Hapus transaksi ini dan koreksi saldo rekening?"))return;try{await api("deleteTransaction",{id});toast("Transaksi dihapus");loadAll()}catch(e){toast(e.message,true)}}
async function removeTransfer(transferId){if(!confirm("Hapus transfer ini dan kembalikan saldo kedua rekening?"))return;try{await api("deleteTransfer",{transferId});toast("Transfer dihapus");loadAll()}catch(e){toast(e.message,true)}}
async function archive(id){if(!confirm("Arsipkan rekening? Saldo harus nol."))return;try{await api("archiveAccount",{id});toast("Rekening diarsipkan");loadAll()}catch(e){toast(e.message,true)}}
async function delCategory(id){if(!confirm("Arsipkan kategori ini? Riwayat transaksi tetap tersimpan."))return;try{await api("deleteCategory",{id});toast("Kategori diarsipkan");loadAll()}catch(e){toast(e.message,true)}}
async function editCategory(id){let c=state.categories.find(x=>x.id===id);if(!c)return;let name=prompt("Nama kategori:",c.name);if(name===null)return;let type=prompt("Jenis: income atau expense",c.type);if(type===null)return;let color=prompt("Warna hex:",c.color);if(color===null)return;try{await api("updateCategory",{id,name,type,color});toast("Kategori diperbarui");loadAll()}catch(e){toast(e.message,true)}}
async function payDebt(id){let d=state.debts.find(x=>x.id===id);let amount=prompt("Nominal pembayaran (Rp). Sisa pokok: "+idr(d.remaining));if(amount===null)return;let accountId=prompt("Masukkan ID rekening pembayaran:\n"+state.accounts.map(a=>a.name+" = "+a.id).join("\n"));if(!accountId)return;let interestPaid=prompt("Bagian bunga dari pembayaran (Rp), isi 0 jika tidak ada","0");try{await api("payDebt",{debtId:id,amount:Number(amount),accountId,interestPaid:Number(interestPaid||0)});toast("Pembayaran utang tercatat");loadAll()}catch(e){toast(e.message,true)}}
async function payReceivable(id){let r=state.receivables.find(x=>x.id===id);let amount=prompt("Nominal uang diterima (Rp). Sisa: "+idr(r.remaining));if(amount===null)return;let accountId=prompt("Masukkan ID rekening penerima:\n"+state.accounts.map(a=>a.name+" = "+a.id).join("\n"));if(!accountId)return;try{await api("payReceivable",{receivableId:id,amount:Number(amount),accountId,date:today()});toast("Penerimaan piutang tercatat");loadAll()}catch(e){toast(e.message,true)}}
async function payBill(id){let b=state.bills.find(x=>x.id===id);let accountId=b.accountId;if(!accountId){accountId=prompt("Masukkan ID rekening pembayaran:\n"+state.accounts.map(a=>a.name+" = "+a.id).join("\n"));if(!accountId)return}try{await api("payBill",{billId:id,accountId});toast("Tagihan dibayar");loadAll()}catch(e){toast(e.message,true)}}
async function contribute(id){let amount=prompt("Nominal tabungan (Rp):");if(amount===null)return;let accountId=prompt("Masukkan ID rekening sumber:\n"+state.accounts.map(a=>a.name+" = "+a.id).join("\n"));if(!accountId)return;try{await api("contributeGoal",{goalId:id,amount:Number(amount),accountId,date:today()});toast("Tabungan berhasil ditambahkan");loadAll()}catch(e){toast(e.message,true)}}
async function saveSettings(){try{await api("updateSettings",{largeExpenseThreshold:$("#threshold").value,warningThreshold:$("#warning").value,disciplineMode:$("#discipline").value});toast("Pengaturan disimpan");loadAll()}catch(e){toast(e.message,true)}}
async function reconcile(){try{let r=await api("reconcile");$("#reconcileResult").innerHTML=`<div class="notice">${r.consistent?"Semua saldo konsisten.":"Ditemukan selisih saldo."}<br>${r.accounts.map(a=>esc(a.account)+": "+idr(a.difference)).join("<br>")}</div>`}catch(e){toast(e.message,true)}}
loadAll();
</script>
</body>
</html>
